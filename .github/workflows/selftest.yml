name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Self-test (checksums, bundled example, edge cases; no MMseqs2 needed)
        run: ecbackoff selftest
      - name: Smoke tests
        run: python -m unittest discover -s tests -v
